exclude_docs: |
  !.well-known
theme:
  logo: assets/wirt_logo.png
  favicon: assets/wirt_logo.png
  name: material  
  features:
    - navigation.tabs
    - content.code.annotate
    - content.code.copy
    - navigation.indexes
    - toc.integrate
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

site_name: Wirt OÜ 
site_description: networking cloud storage consultation
site_url: https://wirt.ee
site_author: Wirt OÜ
site_description: >-
  IT services for sovereign OpenStack cloud

markdown_extensions:
  - meta

plugins:
  - search
  - awesome-pages:
      collapse_single_pages: true

extra:
  generator: false

extra_css: [stylesheets/extra.css] 

copyright: If you have any problems or questions, please write to <a href="mailto:info@wirt.ee">info@wirt.ee</a>

