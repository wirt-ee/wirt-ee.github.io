site_name: Wirt OÜ
site_url: https://wirt.ee/
site_description: "On-prem cloud, storage and firewalls on hardware you own. OpenStack, Ceph, VyOS, on-prem AI. Estonia."
site_author: Wirt OÜ

exclude_docs: |
  !.well-known

theme:
  name: material
  custom_dir: overrides
  logo: assets/wirt_logo.png
  favicon: assets/wirt_logo.png
  features:
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.annotate
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.superfences

plugins:
  - search

extra:
  generator: false

copyright: '| Questions, quotes: <a href="mailto:info@wirt.ee">info@wirt.ee</a> |'

